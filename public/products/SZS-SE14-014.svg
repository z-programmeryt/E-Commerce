<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="New Year Party Props — studio illustration">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#F7F8FA"/><stop offset="1" stop-color="#E7EAF0"/>
    </linearGradient>
    <radialGradient id="spot" cx="46%" cy="30%" r="66%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="72%">
      <stop offset="0.55" stop-color="#0B1B33" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B1B33" stop-opacity=".10"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- seamless studio sweep -->
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#spot)"/>
  <rect width="800" height="1000" fill="url(#vig)"/>

  <!-- cyclorama floor line + contact shadow -->
  <path d="M0 800 Q400 758 800 800 L800 1000 L0 1000 Z" fill="#0B1B33" opacity=".03"/>
  <ellipse cx="400" cy="806" rx="204" ry="26" fill="#0B1B33" opacity=".18" filter="url(#soft)"/>

  <!-- plinth the product stands on -->
  <ellipse cx="400" cy="802" rx="228" ry="52" fill="#FFFFFF" opacity=".8"/>
  <ellipse cx="400" cy="802" rx="228" ry="52" fill="none" stroke="#0B1B33" stroke-opacity=".06" stroke-width="2"/>
  <ellipse cx="400" cy="798" rx="160" ry="30" fill="#FFFFFF" opacity=".55"/>

  <!-- product, enlarged to fill the tile as a catalogue would -->
  <g transform="translate(400 486) scale(1.14) translate(-400 -500)"><path d="M400 244 Q548 300 552 470 Q505 500 470 470 Q436 500 400 470 Q364 500 330 470 Q295 500 248 470 Q252 300 400 244 Z" fill="#8A9A83"/>
<path d="M400 244 L400 470" stroke="#A9B7A2" stroke-width="6" opacity=".7"/>
<path d="M400 244 Q320 340 300 474" stroke="#A9B7A2" stroke-width="5" fill="none" opacity=".5"/>
<path d="M400 244 Q480 340 500 474" stroke="#A9B7A2" stroke-width="5" fill="none" opacity=".5"/>
<circle cx="400" cy="238" r="9" fill="#A9B7A2"/>
<path d="M400 470 L400 700" stroke="#A9B7A2" stroke-width="11" stroke-linecap="round"/>
<path d="M400 700 Q356 706 356 668" stroke="#A9B7A2" stroke-width="10" fill="none" stroke-linecap="round"/></g>
  <rect width="800" height="1000" fill="url(#sheen)"/>

  <text x="56" y="916" font-family="Georgia, 'Times New Roman', serif" font-size="17" letter-spacing="4.5" fill="#6E7B93">Season study</text>
  <text x="56" y="944" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#93A0B6">SUPER Z SHOP</text>
</svg>